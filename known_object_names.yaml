# known_object_names.yaml
#
# Allowlist of deliberate ALL_CAPS_UNDERSCORE identifiers in the generated
# output that are NOT unfilled placeholders.  generate.py's scan_placeholders()
# loads this list and skips any token found here.
#
# WHY THIS EXISTS — generate.py flags every ALL_CAPS_UNDERSCORE token as a
# potentially forgotten placeholder (e.g. TACACS_ENCRYPTED_KEY, CHASSIS_ID_R1).
# SD-WAN operational naming convention uses the same style for real object names
# (route-maps, prefix-lists, sequence names) that are rendered verbatim into the
# device running-config.  Without this allowlist every run would report them as
# warnings, and --strict would abort.
#
# KEEP THIS A CLOSED LIST — never replace with a regex.  The whole point of the
# scan is that an unexpected ALL_CAPS token is reported.  A typo'd object name
# (e.g. OMP_TO_BGP_1OOO_MED with a letter O instead of zero) must still trip
# the warning.  Adding an object to any template means adding its name here.
#
# The -__SITE__ suffix (e.g. LO_BB_PFX-BXT) needs no entry of its own:
# PLACEHOLDER_RE stops at the hyphen, so only the base name is matched.

names:
  # ── Existing route-map objects ────────────────────────────────────────────
  - LO_BB_PFX                             # ipv4 prefix-list (policy-objects.yaml)
  - OMP_TO_BGP_1000_MED                   # route-map (service*.yaml)
  - OMP_TO_BGP_1000_MED_ASPATH_PREPEND_BB # route-map (service*.yaml)
  - SET_MED                               # route-map sequence name
  - PREPEND_BB                            # route-map sequence name

  # ── Forwarding class name prefixes (base before -__SITE__ suffix) ─────────
  # PLACEHOLDER_RE stops at the hyphen, so LO_VOICE-BXT → matches LO_VOICE.
  - LO_VOICE                              # queue 0 (branch + DC)
  - LO_CONTROL                            # queue 2 (branch LO_QOSMAP_V2)
  - LO_REAL                               # queue 3 (branch: LO_REAL-TIME-__SITE__)
  - LO_MULTIMEDIA                         # queue 4 (branch LO_QOSMAP_V2)
  - LO_APPLICATIONS                       # queue 5 (branch + DC)
  - LO_DATA                               # queue 6 (branch + DC)
  - LO_BESTEFFORT                         # queue 7 (branch LO_QOSMAP_V2)
  - LO_VIDEO                              # queue 1 (DC only, LO_QOSMAP V1)
  # LO_DEFAULT / LO_STREAMING / LO_TRANSACTIONAL / LO_SCAVENGER were dropped
  # on 2026-09-02: they were UX1 second names for queues 2/3/4/7, which the
  # data policy fills as LO_CONTROL / LO_REAL-TIME / LO_MULTIMEDIA /
  # LO_BESTEFFORT.  See templates/dc/application-priority.yaml.

  # ── SLA class name prefixes ───────────────────────────────────────────────
  - LO_SLA_VOICE                          # SLA class (application-priority.yaml)
  - LO_SLA_VIDEO                          # SLA class
  - LO_SLA_COMMVAULT                      # SLA class
  - LO_SLA_CUSTOM1                        # SLA class (LO_SLA_CUSTOM1-2-__SITE__)

  # ── Data prefix list name prefixes ───────────────────────────────────────
  - LO_COMMVAULT_SIN_SERVER               # data prefix list (policy-objects.yaml)
  - LO_COMMVAULT_SERVERS                  # data prefix list
  - LO_BACKUP_SERVERS                     # data prefix list
  - LO_TUBE_SERVER                        # data prefix list (QoS classification)
  - LO_SCAVENGER_HOSTS                    # data prefix list (QoS classification)

  # ── Traffic policy sequence names ────────────────────────────────────────
  - VOICE_EF                              # sequence_name in TRAFFIC-__SITE__
  - VIDEO_DSCP_CS4                        # sequence_name (AAR-only, DSCP 32)
  - COMMVAULT_SIN_TO_SERVERS              # sequence_name
  - COMMVAULT_SERVERS_TO_SIN              # sequence_name
  - BACKUP_SERVERS                        # sequence_name

  # ── QoS classification sequence names (QOSCLASS-__SITE__) ────────────────
  # Added 2026-09-02 with the UX1 data-policy migration.
  - VOICE_DSCP_EF
  - VOICE_APPS
  - CONTROL_DSCP_CS6
  - CONTROL_DSCP_CS3
  - CONTROL_DSCP_CS2
  - CONTROL_NETWORK
  - CONTROL_SIGNALING
  - CONTROL_OAM
  - REALTIME_DSCP_AF41
  - REALTIME_CONFERENCING
  - MULTIMEDIA_DSCP_AF31
  - MULTIMEDIA_STREAMING
  - MULTIMEDIA_TUBE_SERVER
  - APPLICATIONS_DSCP_AF21
  - APPLICATIONS_TRANSAC
  - BACKUP_TO_COMMVAULT
  - BACKUP_CIFS
  - BACKUP_PORTS
  - DATA_DSCP_AF11
  - DATA_DSCP_CS1
  - SCAVENGER_HOSTS
  - DEFAULT_BESTEFFORT

  # ── Application list names (base before -__SITE__) ────────────────────────
  # LO_Teams_Video / Windows_File_tranfer are mixed case and never match
  # PLACEHOLDER_RE, so they need no entry.
  - LO_Business_Voice_V2
  - LO_Business_Net_Ctrl_V2
  - LO_Business_Signaling_V2
  - LO_Business_OAM_V2
  - LO_Business_MM_Conf_V2
  - LO_Business_MM_Streaming_V2
  - LO_Business_Transac_Data_V2

  # ── Centralized policy site list names ───────────────────────────────────
  - ALL_SD_WAN_SITES                       # site list (templates/fabric/cflowd.yaml)

  # ── Description string tokens ─────────────────────────────────────────────
  - FABRIC_SECURITY                        # system profile description (system.yaml)
  - LO_QOSMAP                             # appears in description fields (DC V1)
  - LO_QOSMAP_V2                          # appears in description fields
  - LO_AAR                                # appears in description fields
  - LO_QOSClass                           # appears in description fields
