region: dc-hub                      # Must match the regions/dc-hub/ folder name

qos:
  classes:
    - name: VOICE
      bandwidth_percent: 30
      dscp: 46                      # EF — decimal only; provider rejects PHB keywords
    - name: BUSINESS_CRITICAL
      bandwidth_percent: 40
      dscp: 26                      # AF31
    - name: DEFAULT
      bandwidth_percent: 30
      dscp: 0                       # default/BE

topology:
  type: hub                         # DC hub receives hub topology policy

app_route:
  sla_classes:
    - name: REALTIME
      loss_percent: 1
      latency_ms: 100
      jitter_ms: 20
    - name: TRANSACTIONAL
      loss_percent: 2
      latency_ms: 150
      jitter_ms: 30
