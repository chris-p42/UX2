# ── Site-specific system overrides ─────────────────────────────────────────
system:
  snmp:
    location: "Paris - Tour Montparnasse - Floor 25"
# ───────────────────────────────────────────────────────────────────────────

site_id: 300                        # Globally unique — first EMEA site; NA used 200-201
system_ip_a: 10.1.0.1
system_ip_b: 10.1.0.2
hostname_a: par-cedge-01
hostname_b: par-cedge-02
chassis_a: "CSR1000V-PAR-A"
chassis_b: "CSR1000V-PAR-B"

# ── WAN transports ──────────────────────────────────────────────────────────
# Variant A — full branch: dual internet + MPLS + TLOC-EXT → 4 TLOCs per cEdge
transports:
  custom1:
    interface: GigabitEthernet2
    dhcp: true
  custom2:
    interface: GigabitEthernet3
    dhcp: true
  private1:                         # MPLS — OSPF underlay toward PE
    interface: GigabitEthernet4
    ip: 192.168.2.1
    mask: 255.255.255.252
    ospf:
      area: 0

# ── TLOC extension ──────────────────────────────────────────────────────────
tloc_ext:
  port: GigabitEthernet5
  sub_if_extend:
    sub_interface: GigabitEthernet5.101
    vlan: 101
  sub_if_receive:
    sub_interface: GigabitEthernet5.102
    vlan: 102

# ── CLI add-on ───────────────────────────────────────────────────────────────
cli_addon: ~

# ── Route-maps ───────────────────────────────────────────────────────────────
route_maps: {}

# ── Service VPNs ────────────────────────────────────────────────────────────
service_vpns:
  - vpn: 0
    name: TRANSPORT

  - vpn: 10
    name: LAN
    campus_interface:
      port: GigabitEthernet6
      vrfs:
        - name: CORP
          cedge_a:
            vlan: 3110
            ip: 10.10.10.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.10.10.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          cedge_b:
            vlan: 3111
            ip: 10.10.11.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.10.11.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          redistribute_omp: true
        - name: INFRA
          cedge_a:
            vlan: 3120
            ip: 10.20.10.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.20.10.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          cedge_b:
            vlan: 3121
            ip: 10.20.11.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.20.11.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          redistribute_omp: true

omp_advertise_bgp: true
policy_override: ~
