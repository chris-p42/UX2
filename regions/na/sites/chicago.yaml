# ── Site-specific system overrides ─────────────────────────────────────────
system:
  snmp:
    location: "Chicago - 200 N. LaSalle St - Floor 7"
# ───────────────────────────────────────────────────────────────────────────

site_id: 201                        # Globally unique — different from NYC (200), DC hub (100)
system_ip_a: 10.0.2.1
system_ip_b: 10.0.2.2
hostname_a: chi-cedge-01
hostname_b: chi-cedge-02
chassis_a: "CSR1000V-CHI-A"
chassis_b: "CSR1000V-CHI-B"

# ── WAN transports ──────────────────────────────────────────────────────────
# Variant B — internet-only: dual internet, no MPLS → 2 TLOCs per cEdge
transports:
  custom1:                          # ISP-A — DHCP
    interface: GigabitEthernet2
    dhcp: true
  custom2:                          # ISP-B — DHCP
    interface: GigabitEthernet3
    dhcp: true
  # No private1 — internet-only site; no MPLS circuit

# ── TLOC extension ──────────────────────────────────────────────────────────
tloc_ext: ~                         # No MPLS → no peer to extend to; zero TLOC-EXT resources

# ── CLI add-on ───────────────────────────────────────────────────────────────
cli_addon: ~                        # Branch site — no port-channel

# ── Route-maps ───────────────────────────────────────────────────────────────
route_maps: {}

# ── Service VPNs ────────────────────────────────────────────────────────────
service_vpns:
  - vpn: 0
    name: TRANSPORT

  - vpn: 10
    name: LAN
    campus_interface:
      port: GigabitEthernet6
      vrfs:
        - name: CORP
          cedge_a:
            vlan: 3110
            ip: 10.10.5.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.10.5.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          cedge_b:
            vlan: 3111
            ip: 10.10.6.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.10.6.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          redistribute_omp: true
        - name: INFRA
          cedge_a:
            vlan: 3120
            ip: 10.20.5.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.20.5.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          cedge_b:
            vlan: 3121
            ip: 10.20.6.1
            mask: 255.255.255.252
            bgp:
              neighbor_ip: 10.20.6.2
              route_map_in: ~
              route_map_out: ~
            ospf: ~
          redistribute_omp: true

# ── OMP advertisement ────────────────────────────────────────────────────────
omp_advertise_bgp: true

# ── Policy override ──────────────────────────────────────────────────────────
policy_override: ~
