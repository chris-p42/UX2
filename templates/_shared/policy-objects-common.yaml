            - bgp
            - capwap-control
            - cisco-meraki
            - cisco-sdwan-control
            - cisco-tdp
            - egp
            - eigrp
            - igrp
            - isakmp
            - ldp
            - ospf
            - rip
            - ripng
            - vrrp
        - name: "LO_Business_Signaling_V2-__SITE__"
          applications:
            - rtcp
            - rtsp
            - sip
            - sip-tls
            - ms-lync-control
            - h225
            - h245
            - sflow
            - ups
        - name: "LO_Business_OAM_V2-__SITE__"
          applications:
            - dhcp
            - active-directory
            - auth-service
            - auth
            - cisco-controller
            - cisco-cta
            - cisco-fna
            - cisco-nac
            - cisco-rtmt
            - cisco-sd-avc
            - cisco-stealthwatch
            - cisco-sys
            - cisco-tna
            - dhcp-failover
            - dhcp-failover2
            - dhcpv6
            - dhcpv6-client
            - dhcpv6-server
            - dns
            - echo
            - ha-cluster
            - http-mgmt
            - icmp
            - igmp
            - kerberos
            - kerberos-adm
            - ldap
            - ms-netlogon
            - ms-win-dns
            - netflow
            - ntp
            - ping
            - radius
            - rtelnet
            - secure-ldap
            - secure-telnet
            - telnet
            - ssh
            - sshell
            - stuns
            - syslog
            - tacacs
            - tftp
            - traceroute-linux
            - snmp
        - name: "LO_Business_MM_Conf_V2-__SITE__"
          applications:
            - ms-teams-media
            - cisco-ip-sla
            - ms-teams
            - ms-teams-video
            - rtp-video
            - rtp
            - ms-lync
            - ms-lync-video
            - skype
        - name: "LO_Business_MM_Streaming_V2-__SITE__"
          applications:
            - citrix
            - citrix-static
            - vmware-vmotion
            - ms-teams-app-sharing
            - xwindows
            - ms-stream
        - name: "LO_Business_Transac_Data_V2-__SITE__"
          applications:
            - atlassian
            - github
            - reuters
        - name: "Windows_File_tranfer-__SITE__"
          applications:
            - cifs

      # ── Data prefix lists ───────────────────────────────────────────────────
      # Server CIDRs used by the AAR and QoS classification sequences.  All of
      # them were anonymised in the vManage export, so the real values live in
      # globals.yaml and are currently BLOCKING placeholders — generate.py
      # reports them and --strict aborts until they are filled in.
      ipv4_data_prefix_lists:
        - name: "LO_COMMVAULT_SIN_SERVER-__SITE__"
          prefixes: "__GLOBAL:commvault.sin_server_prefixes__"
        - name: "LO_COMMVAULT_SERVERS-__SITE__"
          prefixes: "__GLOBAL:commvault.server_prefixes__"
        - name: "LO_BACKUP_SERVERS-__SITE__"
          prefixes: "__GLOBAL:backup.server_prefixes__"
        - name: "LO_TUBE_SERVER-__SITE__"
          prefixes: "__GLOBAL:qos_hosts.tube_server_prefixes__"
        - name: "LO_SCAVENGER_HOSTS-__SITE__"
          prefixes: "__GLOBAL:qos_hosts.scavenger_host_prefixes__"
