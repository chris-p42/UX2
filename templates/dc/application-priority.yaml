# templates/dc/application-priority.yaml
#
# DC-ONLY part of the Application Priority profile: the QoS scheduler.
# The profile itself and both traffic policies (AAR + QoS classification) are
# fabric-wide and live in templates/_shared/application-priority.yaml; the two
# files merge into one APP-PRIORITY-__SITE__ profile (see the SPLIT ACROSS FILES
# note in templates/_shared/policy-objects.yaml).
#
# Source: UX1 localized qosMap LO_QOSMAP (V1), from LO_DC_Local_Policy.
# Bandwidth split: 10+20+10+15+15+15+10+5 = 100%.
#
# CLASS NAMES RECONCILED 2026-09-02.  UX1 named the DC queues after the V1
# scheduler (LO_DEFAULT q2, LO_STREAMING q3, LO_TRANSACTIONAL q4, LO_SCAVENGER
# q7) while the DC data policy LO_QOSClass_V3 classified traffic into the V2
# names on the SAME queues (LO_CONTROL q2, LO_REAL-TIME q3, LO_MULTIMEDIA q4,
# LO_BESTEFFORT q7) — two names per queue, which UX1 tolerates because the
# class list is what carries the queue number.  UX2 keys the scheduler by
# forwarding class and derives the queue from it, so two names on one queue
# would mean two scheduler entries on that queue.  The scheduler below keeps
# the V1 BANDWIDTH per queue and the V3 NAMES, which is what the traffic
# policy actually sets.  Only LO_VIDEO (queue 1) is DC-specific and it keeps
# its own name — nothing classifies into it today, exactly as in UX1.
#
# BEL is placeholder-blocked — see dc/policy-objects.yaml header.

sdwan:
  feature_profiles:
    application_priority_profiles:
      - name: "APP-PRIORITY-__SITE__"
        # NO `description:` here — it lives in
        # templates/_shared/application-priority-common.yaml and must be
        # declared in exactly ONE file.  Removed 2026-09-04 after a live plan on
        # sites/bel failed with:
        #   Duplicate object key ... Two different items produced the key
        #   "APP-PRIORITY-BEL"  (sdwan_feature_profiles.tf:8)
        # Three files contribute to this profile; the merge produced TWO list
        # items instead of one.  The only structural difference with the branch
        # variant (which merged correctly) was that `description` was declared
        # here AND in _shared with a DIFFERENT value.  Items carrying the same
        # `name` merge only while their scalar keys do not contradict each
        # other; a conflicting scalar makes the merge keep them apart, and
        # `for_each` then trips on the duplicate name.
        # RULE: when a profile is split across files, exactly one file declares
        # its scalars (name + description); the others contribute only lists.

        # Queue 0 had classMapRef null in UX1 (catch-all LLQ); UX2 requires a
        # forwarding class, so it is bound to LO_VOICE — which is also what the
        # traffic policy marks into queue 0.
        qos_policies:
          - name: "QOS-__SITE__"
            description: "QoS scheduler - BEL DC hub (LO_QOSMAP V1)"
            qos_schedulers:
              - forwarding_class: "LO_VOICE-__SITE__"         # queue 0 — LLQ 10%
                bandwidth_percent: 10
                drops: tail-drop
              - forwarding_class: "LO_VIDEO-__SITE__"         # queue 1 — WRR 20% (DC only)
                bandwidth_percent: 20
                drops: tail-drop
              - forwarding_class: "LO_CONTROL-__SITE__"       # queue 2 — WRR 10% (UX1: LO_DEFAULT)
                bandwidth_percent: 10
                drops: tail-drop
              - forwarding_class: "LO_REAL-TIME-__SITE__"     # queue 3 — WRR 15% WRED (UX1: LO_STREAMING)
                bandwidth_percent: 15
                drops: red-drop
              - forwarding_class: "LO_MULTIMEDIA-__SITE__"    # queue 4 — WRR 15% WRED (UX1: LO_TRANSACTIONAL)
                bandwidth_percent: 15
                drops: red-drop
              - forwarding_class: "LO_APPLICATIONS-__SITE__"  # queue 5 — WRR 15% WRED
                bandwidth_percent: 15
                drops: red-drop
              - forwarding_class: "LO_DATA-__SITE__"          # queue 6 — WRR 10% WRED
                bandwidth_percent: 10
                drops: red-drop
              - forwarding_class: "LO_BESTEFFORT-__SITE__"    # queue 7 — WRR 5% WRED (UX1: LO_SCAVENGER)
                bandwidth_percent: 5
                drops: red-drop
